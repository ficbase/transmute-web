server {
    listen 80;
    listen [::]:80;
    server_name epubloom.com www.epubloom.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://epubloom.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.epubloom.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/epubloom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/epubloom.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://epubloom.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name epubloom.com;
    ssl_certificate /etc/letsencrypt/live/epubloom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/epubloom.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:epubloomSSL:10m;
    ssl_session_timeout 1d;

    root /var/www/epubloom/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    access_log /var/log/nginx/epubloom.access.log;
    error_log /var/log/nginx/epubloom.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/wasm application/xml text/xml image/svg+xml text/plain;

    # Match the original URL, so the index module's internal redirects stay valid.
    if ($request_uri ~ "^/index\.html(?:\?|$)") { return 301 /$is_args$args; }
    if ($request_uri ~ "^/zh/index\.html(?:\?|$)") { return 301 /zh/$is_args$args; }
    location ~ /\.(?!well-known/) { deny all; }
    location ~* \.(?:css|js|wasm|svg|png|jpe?g|webp)$ {
        try_files $uri =404;
        expires 1h;
    }
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }
}
