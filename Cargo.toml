[package]
name = "transmute-web"
version = "0.1.0"
edition = "2021"
description = "Web WASM frontend for transmute txt↔epub converter"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
